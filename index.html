<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Züheyr Avto Yuma - VIP Sistem</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        :root { --orange: #ff8c00; --neon: #ffaa00; --bg: #050505; }
        
        body { 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh;
        }

        .container { 
            background: rgba(15, 15, 15, 0.98); padding: 30px; 
            border-radius: 20px; border: 2px solid var(--orange); 
            width: 100%; max-width: 380px; text-align: center; 
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.2);
            backdrop-filter: blur(15px);
        }

        h1 { color: var(--orange); text-transform: uppercase; font-size: 24px; margin-bottom: 5px; letter-spacing: 3px; }
        .subtitle { color: #555; font-size: 12px; text-transform: uppercase; margin-bottom: 25px; }

        .info-card {
            background: #111; border: 1px solid #333; padding: 15px;
            border-radius: 12px; text-align: left; margin: 15px 0;
            border-left: 5px solid var(--orange);
        }

        .info-card p { margin: 8px 0; font-size: 14px; color: #bbb; }
        .info-card b { color: var(--orange); font-size: 16px; }

        input { 
            width: 100%; padding: 14px; margin: 10px 0; 
            background: #000; border: 1px solid #333; 
            color: white; border-radius: 10px; box-sizing: border-box; 
            font-size: 16px;
        }

        input:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 10px rgba(255,140,0,0.3); }

        button { 
            width: 100%; padding: 16px; background: var(--orange); 
            border: none; color: black; font-weight: bold; 
            cursor: pointer; border-radius: 10px; margin-top: 10px; 
            transition: 0.3s; text-transform: uppercase; font-size: 14px;
        }

        button:hover { background: var(--neon); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,140,0,0.4); }

        .hidden { display: none; }
        .balance-box { font-size: 35px; color: var(--orange); font-weight: bold; margin: 20px 0; text-shadow: 0 0 10px rgba(255,140,0,0.5); }
    </style>
</head>
<body>

<div id="app">
    <div id="page-home" class="container">
        <h1>ZÜHEYR</h1>
        <div class="subtitle">Avto Yuma VIP Sistem</div>
        <button onclick="showPage('page-admin-login')">ADMİN GİRİŞİ</button>
        <button onclick="showPage('page-cust-login')" style="background:#222; color:var(--orange); border:1px solid var(--orange);">MÜŞTƏRİ GİRİŞİ</button>
    </div>

    <div id="page-admin-login" class="container hidden">
        <h2>ADMİN LOGİN</h2>
        <input type="text" id="adm-u" placeholder="İstifadəçi Adı">
        <input type="password" id="adm-p" placeholder="Şifrə">
        <button onclick="loginAdmin()">DAXİL OL</button>
        <button onclick="showPage('page-home')" style="background:none; color:#555;">Geri</button>
    </div>

    <div id="page-cust-login" class="container hidden">
        <h2>MÜŞTƏRİ GİRİŞ</h2>
        <input type="text" id="cust-phone-input" placeholder="Telefon Nömrəniz">
        <button onclick="loginCustomer()">GİRİŞ ET</button>
        <button onclick="showPage('page-home')" style="background:none; color:#555;">Geri</button>
    </div>

    <div id="page-admin-panel" class="container hidden">
        <h2>ADMİN PANEL</h2>
        <button onclick="showPage('page-add-user')">YENİ MÜŞTƏRİ YAZ</button>
        <button onclick="showPage('page-bonus-cek')">BONUS ÇIX (Nömrə ilə)</button>
        <button onclick="showPage('page-artir')">BALANS ARTIR (+)</button>
        <button onclick="location.reload()" style="background:#333;">SİSTEMDƏN ÇIX</button>
    </div>

    <div id="page-cust-panel" class="container hidden">
        <h1>ZÜHEYR</h1>
        <div class="subtitle">MÜŞTƏRİ PANELİ</div>
        <div class="info-card">
            <p>Xoş gəldiniz, <b id="welcome-name">...</b></p>
            <p>Nömrəniz: <b id="welcome-phone">...</b></p>
        </div>
        <div class="balance-box"><span id="my-bal">0</span> AZN</div>
        <button onclick="document.getElementById('dep-ui').classList.toggle('hidden')">BALANS ARTIR</button>
        
        <div id="dep-ui" class="hidden">
            <input type="number" id="dep-val" placeholder="Məbləğ">
            <button onclick="showBankInfo()">KART MƏLUMATINI AL</button>
        </div>

        <div id="bank-info" class="hidden" style="border:1px dashed var(--orange); padding:10px; margin-top:10px; font-size:12px; background:#111;">
            Məbləğ: <b id="pay-v">0</b> AZN <br>
            KART: <b>4127 2222 7057 1656</b>
            <button onclick="sendWA()" style="background:#25D366; color:white;">WhatsApp Qəbz Gönder</button>
        </div>
        <button onclick="location.reload()" style="background:none; color:#555; margin-top:20px;">ÇIXIŞ</button>
    </div>

    <div id="page-bonus-cek" class="container hidden">
        <h2>BONUS ÇIXILMASI</h2>
        <input type="text" id="check-phone" placeholder="Müştəri Telefonu">
        <button onclick="fetchCustomerForBonus()">MƏLUMATLARI GƏTİR</button>
        
        <div id="withdraw-ui" class="hidden">
            <div class="info-card">
                <p>Müştəri: <b id="det-name">...</b></p>
                <p>Ata Adı: <b id="det-father">...</b></p>
                <p>Cari Balans: <b id="det-bal" style="color:#00ff00">0</b> AZN</p>
            </div>
            <input type="number" id="minus-val" placeholder="Çıxılacaq Məbləğ">
            <button onclick="confirmWithdraw()" style="background:#c00; color:white;">TƏSDİQLƏ VƏ ÇIX</button>
        </div>
        <button onclick="showPage('page-admin-panel')" style="background:#333;">İMTİNA</button>
    </div>

    <div id="page-add-user" class="container hidden">
        <h2>YENİ QEYDİYYAT</h2>
        <input type="text" id="n-name" placeholder="Ad Soyad">
        <input type="text" id="n-father" placeholder="Ata Adı">
        <input type="text" id="n-phone" placeholder="Telefon">
        <button onclick="addNewCustomer()">SİSTEMƏ YAZ</button>
        <button onclick="showPage('page-admin-panel')">GERİ</button>
    </div>

    <div id="page-artir" class="container hidden">
        <h2>BALANS YÜKLƏ</h2>
        <input type="text" id="t-phone" placeholder="Müştəri Telefonu">
        <input type="number" id="t-amt" placeholder="Məbləğ (AZN)">
        <button onclick="adminDeposit()">BALANSI YÜKLƏ</button>
        <button onclick="showPage('page-admin-panel')">GERİ</button>
    </div>
</div>

<script>
// --- SUPABASE AYARLARI ---
const SUPA_URL = "https://fqeqbcxhjygsdeiyeodj.supabase.co";
const SUPA_KEY = "sb_publishable_Yhs2BpMW34Xk9t1EeOwNtA_I6zTFKVh";
const _supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let targetUserPhone = "";

function showPage(id) {
    document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

// ADMİN LOGİN (ElçinVali1313 / 517012)
function loginAdmin() {
    if(document.getElementById('adm-u').value === "ElçinVali1313" && document.getElementById('adm-p').value === "517012") {
        showPage('page-admin-panel');
    } else { alert("Giriş məlumatları yanlışdır!"); }
}

// MÜŞTƏRİ LOGİN
async function loginCustomer() {
    const p = document.getElementById('cust-phone-input').value;
    const { data } = await _supa.from('customers').select('*').eq('phone', p).single();
    if(data) {
        document.getElementById('welcome-name').innerText = data.full_name;
        document.getElementById('welcome-phone').innerText = data.phone;
        document.getElementById('my-bal').innerText = data.balance;
        showPage('page-cust-panel');
    } else { alert("Bu nömrə ilə müştəri tapılmadı!"); }
}

// YENİ MÜŞTƏRİ YAZ
async function addNewCustomer() {
    const { error } = await _supa.from('customers').insert([{
        full_name: document.getElementById('n-name').value,
        father_name: document.getElementById('n-father').value,
        phone: document.getElementById('n-phone').value,
        balance: 0
    }]);
    if(!error) { alert("Müştəri uğurla əlavə edildi!"); showPage('page-admin-panel'); }
    else { alert("Xəta: " + error.message); }
}

// BALANS ARTIR (ADMİN)
async function adminDeposit() {
    const p = document.getElementById('t-phone').value;
    const a = parseFloat(document.getElementById('t-amt').value);
    const { data } = await _supa.from('customers').select('balance').eq('phone', p).single();
    if(data) {
        await _supa.from('customers').update({ balance: (data.balance || 0) + a }).eq('phone', p);
        alert("Balans artırıldı!");
        showPage('page-admin-panel');
    } else { alert("Nömrə tapılmadı!"); }
}

// BONUS ÇIXMA (NÖMRƏ İLƏ AXTARIŞ)
async function fetchCustomerForBonus() {
    const p = document.getElementById('check-phone').value;
    const { data, error } = await _supa.from('customers').select('*').eq('phone', p).single();
    
    if(data) {
        targetUserPhone = data.phone;
        document.getElementById('det-name').innerText = data.full_name;
        document.getElementById('det-father').innerText = data.father_name;
        document.getElementById('det-bal').innerText = data.balance;
        document.getElementById('withdraw-ui').classList.remove('hidden');
    } else { alert("Müştəri tapılmadı!"); }
}

async function confirmWithdraw() {
    const amt = parseFloat(document.getElementById('minus-val').value);
    if(!amt || amt <= 0) return alert("Məbləği yazın!");

    const { data } = await _supa.from('customers').select('balance').eq('phone', targetUserPhone).single();
    
    if(data && data.balance >= amt) {
        await _supa.from('customers').update({ balance: data.balance - amt }).eq('phone', targetUserPhone);
        alert("Məbləğ çıxıldı! Menyuya qayıdırsınız.");
        showPage('page-admin-panel'); // Əməliyyat bitən kimi menyuya atır
    } else { alert("Balans kifayət deyil!"); }
}

function showBankInfo() {
    const v = document.getElementById('dep-val').value;
    document.getElementById('pay-v').innerText = v;
    document.getElementById('bank-info').classList.remove('hidden');
}

function sendWA() {
    const v = document.getElementById('pay-v').innerText;
    window.open(`https://wa.me/994505974648?text=Salam Züheyr Avto Yuma, ${v} AZN ödəniş etdim. Balansımı artırın.`);
}

// ANTI-PAUSE (OYAQ SAXLA)
setInterval(async () => { await _supa.from('customers').select('id').limit(1); }, 180000);
</script>
</body>
</html>
